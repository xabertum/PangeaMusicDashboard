server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas de texto para reducir el tamaño transferido.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/csv application/json application/javascript
        application/x-javascript text/xml application/xml application/xml+rss;

    # El CSV de datos y el resto de assets no versionados: revalidar siempre.
    location ~* \.csv$ {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre (JS/CSS generados por Angular): cache larga.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Resto de rutas: servir index.html (fallback de aplicación de página única).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
