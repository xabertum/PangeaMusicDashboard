<div class="chart-card">
  <div class="chart-header">
    <h3>Top 15 subgéneros por número de álbumes</h3>
    @if (subgeneroSeleccionado(); as subgenero) {
      <button type="button" class="chip-filter" (click)="limpiarSeleccion()" title="Quitar filtro de subgénero">
        {{ subgenero }} ✕
      </button>
    }
  </div>
  <p class="chart-hint">Haz clic en un subgénero para filtrar los álbumes.</p>
  <div class="chart-container">
    <canvas
      baseChart
      [type]="chartType"
      [data]="chartData()"
      [options]="chartOptions"
      (chartClick)="onChartClick($event)"
    ></canvas>
  </div>
</div>
