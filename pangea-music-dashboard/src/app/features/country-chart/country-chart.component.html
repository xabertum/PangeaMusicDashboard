<div class="chart-card">
  <div class="chart-header">
    <h3>Top 15 países por número de álbumes</h3>
    @if (paisSeleccionado(); as pais) {
      <button type="button" class="chip-filter" (click)="limpiarSeleccion()" title="Quitar filtro de país">
        {{ pais }} ✕
      </button>
    }
  </div>
  <p class="chart-hint">Haz clic en un país para filtrar la tabla de álbumes.</p>
  <div class="chart-container">
    <canvas
      baseChart
      [type]="chartType"
      [data]="chartData()"
      [options]="chartOptions"
      (chartClick)="onChartClick($event)"
    ></canvas>
  </div>
</div>
