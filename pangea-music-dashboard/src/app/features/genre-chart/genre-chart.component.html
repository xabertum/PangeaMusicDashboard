<div class="chart-card">
  <div class="chart-header">
    <h3>Álbumes por género / continente</h3>
    @if (generoSeleccionado(); as genero) {
      <button type="button" class="chip-filter" (click)="limpiarSeleccion()" title="Quitar filtro de género o continente">
        {{ genero }} ✕
      </button>
    }
  </div>
  <p class="chart-hint">Haz clic en un género o continente para filtrar los álbumes.</p>
  <div class="chart-container">
    <canvas
      baseChart
      [type]="chartType"
      [data]="chartData()"
      [options]="chartOptions"
      (chartClick)="onChartClick($event)"
    ></canvas>
  </div>
</div>
